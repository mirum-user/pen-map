<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Map</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #222;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .map-container {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: grab;
      background: #ffffff;
    }

    .map-container.grabbing {
      cursor: grabbing;
    }

    .map-viewport {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      user-select: none;
    }

    .map-image {
      display: block;
      max-width: none;
      border-radius: 4px;
    }

    /* PIN styles */
    .pin {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 5;
    }

    .pin-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #867050;
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      transition: transform 0.15s, background 0.15s;
    }

    .pin:hover .pin-circle,
    .pin.active .pin-circle {
      background: #fff;
      color: #867050;
      transform: scale(1.2);
    }

    .pin-label {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .pin:hover .pin-label {
      opacity: 1;
    }

    /* CLUSTER PINS */
    .cluster-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 5;
    }

    .cluster-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #867050;
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.55);
      transition: transform 0.15s, background 0.15s;
    }

    .cluster-pin:hover .cluster-circle {
      background: #5a4a35;
      transform: scale(1.12);
    }

    /* POPUP */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .popup-overlay.visible {
      display: flex;
    }

    /* MAP TOOLTIP */
    .map-tooltip {
      position: absolute;
      background: #fff;
      border: 2.5px solid #867050;
      border-radius: 14px;
      padding: 10px 16px 10px 10px;
      display: none;
      align-items: center;
      gap: 14px;
      width: 300px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.18);
      z-index: 30;
      pointer-events: none;
      animation: tooltipIn 0.15s ease;
    }

    .map-tooltip.visible {
      display: flex;
    }

    @keyframes tooltipIn {
      from { transform: scale(0.9) translateY(4px); opacity: 0; }
      to   { transform: scale(1)   translateY(0);   opacity: 1; }
    }

    /* Arrow — border layer */
    .map-tooltip::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: var(--arrow-left, 50%);
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 15px solid #867050;
    }

    /* Arrow — fill layer */
    .map-tooltip::before {
      content: '';
      position: absolute;
      bottom: -12px;
      left: var(--arrow-left, 50%);
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 12px solid #fff;
      z-index: 1;
    }

    .tooltip-thumb {
      width: 90px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .tooltip-title {
      font-size: 1rem;
      font-weight: 700;
      color: #222;
      line-height: 1.35;
    }

    /* ZOOM CONTROLS */
    .zoom-controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }

    .zoom-btn {
      width: 40px;
      height: 40px;
      background: #ffffff;
      border: 2px solid #867050;
      color: #867050;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }

    .zoom-btn:hover {
      background: #867050;
      color: #fff;
    }

    .zoom-reset {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .hint {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #ccc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      pointer-events: none;
      z-index: 20;
      transition: opacity 1s;
    }

    .hint.hidden {
      opacity: 0;
    }
  </style>
</head>

  const CLUSTER_MAP_RADIUS = 100;   // map-space distance to merge pins
  let pinMode = null;               // 'individual' | 'cluster'

  function clearPins() {
    viewport.querySelectorAll('.pin, .cluster-pin').forEach(el => el.remove());
    // hide any open tooltip when switching modes
    if (typeof tooltip !== 'undefined') tooltip.classList.remove('visible');
  }

  function buildPin(a) {
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.left = a.x + 'px';
    pin.style.top  = a.y + 'px';
    pin.dataset.id = a.id;
    pin.innerHTML  = `<div class="pin-circle" style="background:${a.color}">${a.id}</div><div class="pin-label">${a.name}</div>`;
    pin.addEventListener('click', e => { e.stopPropagation(); openPopup(a); });
    return pin;
  }

  function computeClusters() {
    const assigned = new Set();
    const clusters = [];
    for (let i = 0; i < attractions.length; i++) {
      if (assigned.has(i)) continue;
      const items = [attractions[i]];
      assigned.add(i);
      let cx = attractions[i].x, cy = attractions[i].y;
      for (let j = i + 1; j < attractions.length; j++) {
        if (assigned.has(j)) continue;
        const dx = attractions[j].x - cx;
        const dy = attractions[j].y - cy;
        if (Math.sqrt(dx * dx + dy * dy) < CLUSTER_MAP_RADIUS) {
          items.push(attractions[j]);
          assigned.add(j);
          cx = items.reduce((s, a) => s + a.x, 0) / items.length;
          cy = items.reduce((s, a) => s + a.y, 0) / items.length;
        }
      }
      clusters.push({ items, cx, cy });
    }
    return clusters;
  }

  function renderIndividualPins() {
    clearPins();
    attractions.forEach(a => viewport.appendChild(buildPin(a)));
    pinMode = 'individual';
  }

  function renderClusterPins() {
    clearPins();
    computeClusters().forEach(cluster => {
      if (cluster.items.length === 1) {
        viewport.appendChild(buildPin(cluster.items[0]));
        return;
      }
      const el = document.createElement('div');
      el.className = 'cluster-pin';
      el.style.left = cluster.cx + 'px';
      el.style.top  = cluster.cy + 'px';
      el.innerHTML  = `<div class="cluster-circle">${cluster.items.length}</div>`;
      el.addEventListener('click', e => {
        e.stopPropagation();
        cancelInertia();
        const rect    = container.getBoundingClientRect();
        const tgtScale = ZOOM_LEVELS[1];
        const newPanX  = rect.width  / 2 - cluster.cx * tgtScale;
        const newPanY  = rect.height / 2 - cluster.cy * tgtScale;
        scale = tgtScale;
        [panX, panY] = clampPan(newPanX, newPanY, scale);
        applyTransform();
      });
      viewport.appendChild(el);
    });
    pinMode = 'cluster';
  }

  function updatePinMode() {
    const next = scale < CLUSTER_THRESHOLD ? 'cluster' : 'individual';
    if (next === pinMode) return;
    next === 'cluster' ? renderClusterPins() : renderIndividualPins();
  }

  // ─── TOOLTIP ──────────────────────────────────────────────────────────────────
  const tooltip      = document.getElementById("mapTooltip");
  const tooltipThumb = document.getElementById("tooltipThumb");
  const tooltipTitle = document.getElementById("tooltipTitle");
  const TOOLTIP_W    = 300;
  const TOOLTIP_H    = 92;  // approx height incl padding
  const ARROW_GAP    = 18;  // distance from pin centre to tooltip bottom

  function generateThumbSVG(a) {
    const svgContent = `
      <svg xmlns='http://www.w3.org/2000/svg' width='90' height='72'>
        <defs>
          <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
            <stop offset='0%' style='stop-color:${a.thumbBg};stop-opacity:1'/>
            <stop offset='100%' style='stop-color:${a.color};stop-opacity:1'/>
          </linearGradient>
        </defs>
        <rect width='90' height='72' fill='url(#bg)' rx='8'/>
        <text x='45' y='44' text-anchor='middle' font-size='32' font-family='Segoe UI Emoji,Apple Color Emoji,sans-serif'>${a.icon}</text>
      </svg>
    `.trim();
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgContent);
  }

  function openPopup(a) {
    document.querySelectorAll(".pin").forEach(p => p.classList.remove("active"));
    const activePin = document.querySelector(`.pin[data-id="${a.id}"]`);
    if (activePin) activePin.classList.add("active");

    tooltipThumb.src = generateThumbSVG(a);
    tooltipThumb.alt = a.name;
    tooltipTitle.textContent = a.name;

    // Calculate screen position of the pin
    const containerRect = container.getBoundingClientRect();
    const screenX = panX + a.x * scale;
    const screenY = panY + a.y * scale;

    // Place tooltip above pin, centred horizontally
    let left = screenX - TOOLTIP_W / 2;
    const top  = screenY - TOOLTIP_H - ARROW_GAP;

    // Clamp horizontally within container
    const pad = 8;
    left = Math.max(pad, Math.min(left, containerRect.width - TOOLTIP_W - pad));

    // Arrow horizontal position relative to tooltip
    const arrowLeft = Math.max(20, Math.min(screenX - left, TOOLTIP_W - 20));

    tooltip.style.left = left + "px";
    tooltip.style.top  = top  + "px";
    tooltip.style.setProperty("--arrow-left", arrowLeft + "px");
    tooltip.classList.add("visible");
  }

  function closePopup() {
    tooltip.classList.remove("visible");
    document.querySelectorAll(".pin").forEach(p => p.classList.remove("active"));
  }

  document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });

  // ─── PAN & ZOOM ──────────────────────────────────────────────────────────────
  let scale = 1;
  let panX = 0;
  let panY = 0;
  // Two discrete zoom levels: [cluster/out, individual/in]
  const ZOOM_LEVELS = [0.65, 1.2];

  // ─── INERTIA ─────────────────────────────────────────────────────────────────
  let velX = 0, velY = 0;
  let lastMoveX = 0, lastMoveY = 0, lastMoveTime = 0;
  let inertiaRAF = null;
  const FRICTION = 0.93;
  const MIN_VEL  = 0.3;

  function cancelInertia() {
    if (inertiaRAF) { cancelAnimationFrame(inertiaRAF); inertiaRAF = null; }
  }

  function startInertia() {
    cancelInertia();
    if (Math.abs(velX) < MIN_VEL && Math.abs(velY) < MIN_VEL) return;
    function step() {
      velX *= FRICTION;
      velY *= FRICTION;
      if (Math.abs(velX) < MIN_VEL && Math.abs(velY) < MIN_VEL) { inertiaRAF = null; return; }
      [panX, panY] = clampPan(panX + velX, panY + velY, scale);
      applyTransform();
      inertiaRAF = requestAnimationFrame(step);
    }
    inertiaRAF = requestAnimationFrame(step);
  }

  function clampPan(x, y, s) {
    const rect = container.getBoundingClientRect();
    const scaledW = MAP_W * s;
    const scaledH = MAP_H * s;
    const cx = scaledW <= rect.width
      ? (rect.width  - scaledW) / 2
      : Math.min(0, Math.max(rect.width  - scaledW, x));
    const cy = scaledH <= rect.height
      ? (rect.height - scaledH) / 2
      : Math.min(0, Math.max(rect.height - scaledH, y));
    return [cx, cy];
  }

  function applyTransform() {
    viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    updatePinMode();
  }

  function snapToLevel(lvl, focusX, focusY) {
    const newScale = ZOOM_LEVELS[lvl];
    if (newScale === scale) return;
    const ratio  = newScale / scale;
    const newPanX = focusX - ratio * (focusX - panX);
    const newPanY = focusY - ratio * (focusY - panY);
    scale = newScale;
    [panX, panY] = clampPan(newPanX, newPanY, scale);
    applyTransform();
  }

  function initialCenter() {
    const rect = container.getBoundingClientRect();
    scale = ZOOM_LEVELS[0];
    panX = (rect.width  - MAP_W * scale) / 2;
    panY = (rect.height - MAP_H * scale) / 2;
    applyTransform();
  }

  initialCenter(); // initial layout before image loads
  const mapImg = document.getElementById("mapImage");
  function setupMap() {
    MAP_W = mapImg.naturalWidth;
    MAP_H = mapImg.naturalHeight;
    mapImg.style.width = MAP_W + "px";
    mapImg.style.height = MAP_H + "px";
    initialCenter();
  }
  if (mapImg.complete && mapImg.naturalWidth > 0) {
    setupMap();
  } else {
    mapImg.addEventListener("load", setupMap);
  }
  window.addEventListener("resize", initialCenter);

  // Mouse wheel zoom — snap between the two levels
  container.addEventListener("wheel", e => {
    e.preventDefault();
    cancelInertia();
    const rect   = container.getBoundingClientRect();
    const focusX = e.clientX - rect.left;
    const focusY = e.clientY - rect.top;
    snapToLevel(e.deltaY < 0 ? 1 : 0, focusX, focusY);
  }, { passive: false });

  // Drag to pan
  let dragging = false;
  let hasDragged = false;
  let dragStartX = 0, dragStartY = 0;
  let panStartX = 0, panStartY = 0;

  container.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    cancelInertia();
    velX = 0; velY = 0;
    dragging = true;
    hasDragged = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
    lastMoveX = e.clientX;
    lastMoveY = e.clientY;
    lastMoveTime = performance.now();
    container.classList.add("grabbing");
  });

  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    const now = performance.now();
    const dt = now - lastMoveTime;
    if (dt > 0) {
      velX = (e.clientX - lastMoveX) / dt * 16;
      velY = (e.clientY - lastMoveY) / dt * 16;
    }
    lastMoveX = e.clientX;
    lastMoveY = e.clientY;
    lastMoveTime = now;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) hasDragged = true;
    [panX, panY] = clampPan(panStartX + dx, panStartY + dy, scale);
    applyTransform();
  });

  window.addEventListener("mouseup", e => {
    if (dragging && !hasDragged) closePopup();
    const wasD = hasDragged;
    dragging = false;
    container.classList.remove("grabbing");
    if (wasD) startInertia();
  });

  // Touch support
  let lastTouchDist = null;
  let lastTouchMid = null;

  container.addEventListener("touchstart", e => {
    cancelInertia();
    velX = 0; velY = 0;
    if (e.touches.length === 1) {
      dragging = true;
      hasDragged = false;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      panStartX = panX;
      panStartY = panY;
      lastMoveX = e.touches[0].clientX;
      lastMoveY = e.touches[0].clientY;
      lastMoveTime = performance.now();
    } else if (e.touches.length === 2) {
      dragging = false;
      lastTouchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      lastTouchMid = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
    }
  }, { passive: true });

  container.addEventListener("touchmove", e => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
      const now = performance.now();
      const dt = now - lastMoveTime;
      if (dt > 0) {
        velX = (e.touches[0].clientX - lastMoveX) / dt * 16;
        velY = (e.touches[0].clientY - lastMoveY) / dt * 16;
      }
      lastMoveX = e.touches[0].clientX;
      lastMoveY = e.touches[0].clientY;
      lastMoveTime = now;
      const dx = e.touches[0].clientX - dragStartX;
      const dy = e.touches[0].clientY - dragStartY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) hasDragged = true;
      [panX, panY] = clampPan(panStartX + dx, panStartY + dy, scale);
      applyTransform();
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const mid  = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
      const rect = container.getBoundingClientRect();
      // snap to level based on pinch direction
      snapToLevel(dist > lastTouchDist ? 1 : 0, mid.x - rect.left, mid.y - rect.top);
      lastTouchDist = dist;
      lastTouchMid  = mid;
    }
  }, { passive: false });

  container.addEventListener("touchend", () => {
    const wasD = hasDragged;
    dragging = false;
    lastTouchDist = null;
    if (wasD) startInertia();
  });

  // Button zoom — snap between the two levels
  document.getElementById("zoomIn").addEventListener("click", () => {
    const rect = container.getBoundingClientRect();
    snapToLevel(1, rect.width / 2, rect.height / 2);
  });

  document.getElementById("zoomOut").addEventListener("click", () => {
    const rect = container.getBoundingClientRect();
    snapToLevel(0, rect.width / 2, rect.height / 2);
  });

  document.getElementById("zoomReset").addEventListener("click", initialCenter);

  // Hide hint after 4 seconds
  setTimeout(() => {
    document.getElementById("hint").classList.add("hidden");
  }, 4000);
</script>
</body>
</html>
